<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;700&family=Patrick+Hand&family=Kalam:wght@400;700&family=Space+Mono:wght@400;700&family=Architects+Daughter&family=Shadows+Into+Light&family=Press+Start+2P&family=Orbitron:wght@500;700&family=Archivo+Narrow:wght@500;700&display=swap">
<style>
/* base reset, so the page renders the same when served on its own */
body { margin: 0 } img { max-width: 100% } [hidden] { display: none !important }
/* Layout: instrument bench. 3D machine on the left, gauges and controls on the right, charts and missions below. */
:root {
  --bg: #efeae2; --panel: #fbf8f3; --ink: #2a2521; --muted: #6d655c; --line: #ddd3c5;
  --accent: #2f7d73; --hot: #d9673f; --cold: #3f86b0; --ok: #4f8a4a; --warn: #c98a22; --bad: #c2453a;
  --stage: radial-gradient(120% 90% at 50% 30%, #fffdf8 0%, #ebe2d4 100%);
  --f-disp: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1816; --panel: #24201d; --ink: #efe6da; --muted: #a89c8f; --line: #3a332d;
  --accent: #6fc0b2; --hot: #f08a5d; --cold: #6fb0d8; --ok: #7cc38a; --warn: #e8b04f; --bad: #f07b6b;
  --stage: radial-gradient(120% 90% at 50% 30%, #3a322c 0%, #1d1916 100%); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1816; --panel: #24201d; --ink: #efe6da; --muted: #a89c8f; --line: #3a332d;
  --accent: #6fc0b2; --hot: #f08a5d; --cold: #6fb0d8; --ok: #7cc38a; --warn: #e8b04f; --bad: #f07b6b;
  --stage: radial-gradient(120% 90% at 50% 30%, #3a322c 0%, #1d1916 100%); color-scheme: dark }
/* Looks: hand-drawn styles commit to one paper each, so they override the light/dark tokens on purpose */
:root[data-style="ink"] { --bg: #f1e7d6; --panel: #f7efe2; --ink: #4a3424; --muted: #806a52; --line: #cdb898; --accent: #b4583a; --hot: #c0623a; --cold: #4d7f99; --ok: #5f8a46; --warn: #b98431; --bad: #b1453a; --stage: #f1e7d6;
  --f-disp: "Caveat", cursive; --f-body: "Caveat", cursive; --f-mono: "Caveat", cursive; color-scheme: light }
:root[data-style="comic"] { --bg: #fbf1e1; --panel: #fff9ef; --ink: #2d2622; --muted: #6b5f57; --line: #2d2622; --accent: #e0683f; --hot: #e86f45; --cold: #4f95c6; --ok: #4f9b5e; --warn: #e2a43b; --bad: #d64c3f; --stage: #fdf5e8;
  --f-disp: "Patrick Hand", cursive; --f-body: "Patrick Hand", cursive; --f-mono: "Patrick Hand", cursive; color-scheme: light }
:root[data-style="chalk"] { --bg: #2c362f; --panel: #333f37; --ink: #f4ecdc; --muted: #c4bfae; --line: #66705f; --accent: #f1c46b; --hot: #f2a07b; --cold: #9fcfe0; --ok: #b5d99a; --warn: #f1c46b; --bad: #f29a8e; --stage: #333f37;
  --f-disp: "Kalam", cursive; --f-body: "Kalam", cursive; --f-mono: "Kalam", cursive; color-scheme: dark }
:root[data-style="dither"] { --bg: #efe4cf; --panel: #efe4cf; --ink: #3b2f29; --muted: #6b5b4f; --line: #3b2f29; --accent: #3b2f29; --hot: #3b2f29; --cold: #7b6a5c; --ok: #3b2f29; --warn: #3b2f29; --bad: #3b2f29; --stage: #efe4cf;
  --f-disp: "Space Mono", monospace; --f-body: "Space Mono", monospace; --f-mono: "Space Mono", monospace; color-scheme: light }
:root[data-style="blueprint"] { --bg: #2f4466; --panel: #34496d; --ink: #f6ecd9; --muted: #c3c9d6; --line: #7889a8; --accent: #f2c66d; --hot: #f4a582; --cold: #a9d4e8; --ok: #b6dca0; --warn: #f2c66d; --bad: #f4998c; --stage: #33496e;
  --f-disp: "Architects Daughter", cursive; --f-body: "Architects Daughter", cursive; --f-mono: "Architects Daughter", cursive; color-scheme: dark }
:root[data-style="riso"] { --bg: #f8ece0; --panel: #fdf5ec; --ink: #2f5f66; --muted: #6f7d78; --line: #2f7f86; --accent: #e8665f; --hot: #e8665f; --cold: #2f7f86; --ok: #4f9b6a; --warn: #ef8f4a; --bad: #d9534f; --stage: #f8ece0;
  --f-disp: "Archivo Narrow", sans-serif; --f-body: "Archivo Narrow", sans-serif; --f-mono: "Archivo Narrow", sans-serif; color-scheme: light }
:root[data-style="pencil"] { --bg: #f5efe5; --panel: #fbf7f0; --ink: #534b44; --muted: #857a70; --line: #b9ad9e; --accent: #c0603e; --hot: #c0603e; --cold: #4f7fa6; --ok: #5f8a50; --warn: #c38f35; --bad: #b94c3c; --stage: #f7f1e7;
  --f-disp: "Shadows Into Light", cursive; --f-body: "Shadows Into Light", cursive; --f-mono: "Shadows Into Light", cursive; color-scheme: light }
:root[data-style="pixel"] { --bg: #2a2233; --panel: #372c42; --ink: #f7e8d2; --muted: #c2acb9; --line: #5c4a6b; --accent: #f4b860; --hot: #f28a6b; --cold: #7fc4d8; --ok: #9bd98a; --warn: #f4b860; --bad: #f27a7a; --stage: #2c2436;
  --f-disp: "Press Start 2P", monospace; --f-body: "Press Start 2P", monospace; --f-mono: "Press Start 2P", monospace; color-scheme: dark }
:root[data-style="neon"] { --bg: #160f1d; --panel: #1f1628; --ink: #fbe9f0; --muted: #b39ab5; --line: #3d2c4a; --accent: #ff9ec7; --hot: #ff8f6b; --cold: #7fe3e0; --ok: #a8f0b0; --warn: #ffd27f; --bad: #ff7f8f; --stage: #160f1d;
  --f-disp: "Orbitron", sans-serif; --f-body: "Orbitron", sans-serif; --f-mono: "Orbitron", sans-serif; color-scheme: dark }
:root[data-style="pixel"] .panel, :root[data-style="pixel"] .stage, :root[data-style="pixel"] .tile, :root[data-style="pixel"] ol.missions li { border-radius: 0; box-shadow: 3px 3px 0 var(--line) }
:root[data-style="neon"] .panel, :root[data-style="neon"] .stage, :root[data-style="neon"] .tile, :root[data-style="neon"] ol.missions li { border-radius: 6px; border-color: var(--accent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 35%, transparent) }
:root[data-style="blueprint"] .chart > svg, :root[data-style="pencil"] .chart > svg { filter: url(#hand) }
:root:not([data-style="clean"]):not([data-style="cad"]) .panel, :root:not([data-style="clean"]):not([data-style="cad"]) .stage { border: 1px solid var(--ink); border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px }
:root:not([data-style="clean"]):not([data-style="cad"]) .tile, :root:not([data-style="clean"]):not([data-style="cad"]) ol.missions li { border-color: var(--ink); border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px }
:root[data-style="ink"] .chart > svg, :root[data-style="comic"] .chart > svg, :root[data-style="chalk"] .chart > svg { filter: url(#hand) }
.looks { display: flex; gap: 2px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; max-width: 100%; overflow-x: auto }
.looks span { font-size: 12px; color: var(--muted); padding: 0 6px }
.looks button { font: 500 13px/1 var(--f-body); border: 0; background: none; color: var(--muted); padding: 8px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap }
.looks button[aria-pressed="true"] { background: var(--accent); color: var(--panel) }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; padding-block: 18px 12px; max-width: 1400px; margin: 0 auto }
h1 { font: 700 30px/1 var(--f-disp); letter-spacing: .01em; margin: 0; text-wrap: balance }
h1 small { display: block; font: 400 13px/1.4 var(--f-body); color: var(--muted); margin-top: 6px; letter-spacing: 0 }
nav { display: flex; gap: 4px; max-width: 100%; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px }
nav button { font: 600 16px/1 var(--f-disp); letter-spacing: .04em; text-transform: uppercase; border: 0; background: none; color: var(--muted);
  padding: 10px 14px; border-radius: 7px; cursor: pointer }
nav button[aria-selected="true"] { background: var(--ink); color: var(--panel) }
nav button:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
main { max-width: 1400px; margin: 0 auto; display: grid; gap: 14px }
/* Workbench: controls | 3D model | charts in one row, so every change shows in the model and the plots together */
.bench { display: grid; grid-template-columns: 300px minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; align-items: stretch }
.intro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 24px; align-items: end }
.intro h2 { margin: 0 } .intro .home { margin: 0 }
.learn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0 }
.ctl .sliders { gap: 6px } .ctl .sl label { font-size: 12.5px }
.stage { position: relative; min-height: 460px; border-radius: 12px; overflow: hidden; background: var(--stage); border: 1px solid var(--line); min-width: 0 }
.charts { display: grid; gap: 12px; align-content: start }
.chart { padding: 10px 12px }
.ch { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none }
.ov { position: absolute; inset: 10px 10px auto 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none }
.ov > * { pointer-events: auto }
.chip { font: 500 12px/1 var(--f-body); border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 88%, transparent); color: var(--ink);
  padding: 7px 10px; border-radius: 99px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink) }
.ovb { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; pointer-events: none }
.ovb > * { pointer-events: auto }
.caption { font: 12px/1.4 var(--f-mono); color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 5px 8px; border-radius: 6px }
.alarm { position: absolute; top: 50px; right: 10px; font: 700 18px/1 var(--f-disp); letter-spacing: .06em; color: #fff; background: var(--bad); padding: 8px 12px; border-radius: 6px; text-transform: uppercase }
.eyebrow { font: 600 13px/1 var(--f-disp); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px }
h2 { font: 700 24px/1.1 var(--f-disp); margin: 0 0 6px; text-wrap: balance }
p { margin: 0 0 8px; max-width: 65ch }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; background: var(--panel) }
.tile b { display: block; font: 500 21px/1.15 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.tile b small { font-size: 12px; color: var(--muted); margin-left: 3px }
.tile span { font-size: 12px; color: var(--muted) }
.tile em { display: block; font: 11px/1.3 var(--f-mono); font-style: normal; color: var(--muted) }
.tile.good b { color: var(--ok) } .tile.warn b { color: var(--warn) } .tile.bad b { color: var(--bad) }
.sliders { display: grid; gap: 10px }
.sl label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px }
.sl output { font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap }
.sl input { width: 100%; accent-color: var(--accent); margin: 2px 0 0; height: 24px }
.sl .hint { font-size: 11.5px; color: var(--muted) }
.btns { display: flex; flex-wrap: wrap; gap: 6px }
.btn { font: 600 15px/1 var(--f-disp); letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--ink); background: var(--ink); color: var(--panel);
  padding: 10px 14px; border-radius: 8px; cursor: pointer }
.btn.ghost { background: none; color: var(--ink) }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px }
.preset { font: 500 12px/1.2 var(--f-body); border: 1px solid var(--line); background: none; color: var(--ink); padding: 6px 9px; border-radius: 7px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; text-align: left }
.preset i { width: 8px; height: 8px; border-radius: 2px; flex: none }
.preset.opt i { background: var(--ok) } .preset.typ i { background: var(--muted) } .preset.edge i { background: var(--bad) }
.preset[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink) }
.pnote { font-size: 12.5px; line-height: 1.45; margin: 0 0 12px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--line) 35%, transparent) }
.pnote b { font-weight: 600 }
.chart h3 { font: 600 17px/1.2 var(--f-disp); margin: 0 0 2px; letter-spacing: .02em }
.chart p { font-size: 12.5px; color: var(--muted); margin: 0 0 6px }
.chart > svg { width: 100%; height: auto; display: block; overflow: hidden }
svg text { fill: var(--muted); font: 10px var(--f-mono) }
svg .axlab { fill: var(--ink); font: 500 10.5px var(--f-body) }
svg .grid line { stroke: var(--line); stroke-width: .6 }
svg .frame { fill: none; stroke: var(--line) }
svg .dome { fill: color-mix(in srgb, var(--cold) 10%, transparent); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3 }
svg .s-hot { stroke: var(--hot); fill: none; stroke-width: 2.2 } svg .s-cold { stroke: var(--cold); fill: none; stroke-width: 2.2 }
svg .s-mut { stroke: var(--muted); fill: none; stroke-width: 1.8 } svg .s-ink { stroke: var(--ink); fill: none; stroke-width: 2 }
svg .s-acc { stroke: var(--accent); fill: none; stroke-width: 2.2 } svg .s-bad { stroke: var(--bad); fill: none; stroke-width: 1.5; stroke-dasharray: 5 3 }
svg .dash { stroke-dasharray: 4 3 } svg .hl { stroke-width: 5 }
svg .f-bad { fill: color-mix(in srgb, var(--bad) 12%, transparent); stroke: none }
svg .f-hot { fill: color-mix(in srgb, var(--hot) 14%, transparent); stroke: none }
svg .lbl { fill: var(--ink); font: 600 11px var(--f-body) }
svg .lbl-bad { fill: var(--bad); font: 600 10px var(--f-body) }
svg .lbl-acc { fill: var(--accent); font: 600 10px var(--f-body) }
svg .ghost { stroke: var(--ok); fill: none; stroke-width: 1.8; stroke-dasharray: 2 3 } svg .lbl-ok { fill: var(--ok); font: 600 10px var(--f-body) }
svg .dot { fill: var(--ink); stroke: var(--panel); stroke-width: 2 }
svg .pt-k { fill: var(--bad) } svg .pt { fill: var(--accent) } svg .trail { fill: var(--accent); opacity: .35 }
ol.missions { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: m }
ol.missions li { counter-increment: m; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 8px }
ol.missions li::before { content: counter(m); font: 700 18px/30px var(--f-disp); text-align: center; border-radius: 50%; border: 1.5px solid var(--line); width: 30px; height: 30px }
ol.missions li.done::before { content: "✓"; background: var(--ok); border-color: var(--ok); color: #fff }
ol.missions b { display: block; font-weight: 600 } ol.missions span { font-size: 13px; color: var(--muted) }
ol.missions li.done span.win { color: var(--ok) }
.service { display: grid; gap: 8px; margin-top: 10px }
.service .msg { font-size: 13px }
details { font-size: 13px; color: var(--muted) } details summary { cursor: pointer; color: var(--ink); font-weight: 600 }
details ul { padding-left: 18px; margin: 6px 0 } details li { margin-bottom: 4px }
.home { font-size: 14px; border-left: 3px solid var(--accent); padding: 4px 0 4px 10px; margin-top: 8px }
.score { font: 500 13px var(--f-mono); color: var(--muted) }
@media (max-width: 1180px) { .bench { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) } .ctl { grid-column: 1 / -1; order: 3 }
  .ctl .sliders { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); column-gap: 20px } }
@media (max-width: 760px) { .bench, .intro, .learn { grid-template-columns: minmax(0, 1fr) } .stage { height: 52vh; min-height: 320px }
  .charts { order: 2 } .tiles { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)) } }
@media (max-width: 480px) { nav button { padding: 9px 9px; font-size: 14px } h1 { font-size: 26px } .tile b { font-size: 18px } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto } }
/* Layout lock: every look keeps the same boxes. Fonts change, sizes and line counts do not. */
*, *::before, *::after { font-size-adjust: .52 !important }
.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
header { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title looks" "nav nav"; align-items: center; gap: 10px 20px }
header h1 { grid-area: title; min-width: 0 } header .looks { grid-area: looks } header nav { grid-area: nav; justify-self: start }
h1, h1 small, nav button, .looks button, .eyebrow, .chart h3, .tile span, .tile b, .tile em, .sl label span, .preset, ol.missions b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.looks { flex-wrap: nowrap; height: 44px; align-items: center }
.intro h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2 }
.intro .home, .chart p, .sl .hint, ol.missions span, .pnote { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden }
.intro .home { -webkit-line-clamp: 3; height: 63px; line-height: 1.5 }
.chart p { -webkit-line-clamp: 2; height: 38px; line-height: 1.5 }
.sl .hint { -webkit-line-clamp: 2; height: 33px; line-height: 1.4 }
.pnote { -webkit-line-clamp: 5; height: 107px; display: block; overflow-y: auto }
ol.missions span { -webkit-line-clamp: 3; height: 55px; line-height: 1.4 }
.tile { height: 76px } .tile b small { font-size: 12px }
.presets { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px } .sliders { grid-template-columns: minmax(0, 1fr) } .ctl, .charts, .stage, .learn > * { min-width: 0 } .preset { display: flex; min-width: 0 } .preset i + * , .preset { text-overflow: ellipsis }
.sl label { flex-wrap: nowrap } .sl label span { min-width: 0 }

.looks { display: grid; grid-auto-flow: column; grid-auto-columns: 70px } .looks span, .looks button { text-align: center; padding-inline: 2px; overflow: hidden; text-overflow: ellipsis }
.ch { height: 30px; overflow: hidden } .chart h3 { line-height: 30px }
#conceptText { display: block; height: 126px; line-height: 1.5; overflow-y: auto }
p { max-width: 36rem } .eyebrow { height: 16px; line-height: 16px } .preset { height: 30px; line-height: 16px }
.sl label { height: 20px; line-height: 20px; align-items: center; min-width: 0 } .sl output { flex: 0 1 auto; min-width: 0; max-width: 58%; overflow: hidden; padding-left: 6px } .sl input, .chart > svg, .btn { display: block } .sl output { line-height: 20px }
ol.missions b { height: 20px; line-height: 20px } details summary { height: 22px; line-height: 22px; overflow: hidden }
.tile span, .tile em { display: block; height: 16px; line-height: 16px } .tile b { height: 28px; line-height: 28px }
.tile { height: 104px } .tile b { height: 28px; line-height: 28px }
.tile span, .tile em, h1 small { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden }
.tile span { height: 30px; line-height: 15px } .tile em { height: 28px; line-height: 14px } h1 small { height: 37px; line-height: 1.4 }
.intro .home { -webkit-line-clamp: 4; height: 84px }
nav { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); grid-auto-rows: 46px; gap: 4px; height: auto !important; padding: 4px; width: 100%; justify-self: stretch !important; overflow: visible }
nav button { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; padding: 4px 10px; height: 46px; min-width: 0; text-align: left; border: 1px solid transparent; border-radius: 8px }
nav button small { font: 600 9.5px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); opacity: .85; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

const labs = {}; let cur = null;

let last = performance.now();
function loop(now) {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;  // rAF time can be earlier than the last stamp
  if (cur && !document.hidden) { cur.frame(reduced ? dt * .3 : dt); controls.update(); draw(cur.scene, now); }
  requestAnimationFrame(loop);
}
// nav: category row, then the machines of the open category (labs not listed fall into the last group)
const GROUPS = [['Home', ['fridge', 'washer', 'microwave', 'heatpump', 'thermostat']], ['Road', ['engine', 'bicycle']],
  ['Power', ['motor', 'pump', 'windturbine', 'battery']], ['Air', ['airfoil']], ['Signals', ['gps']], ['Light', ['camera']]];
const groupOf = id => (GROUPS.find(g => g[1].includes(id)) || GROUPS[GROUPS.length - 1])[0];
function boot() {
  buildLooks();
  const order = GROUPS.flatMap(g => g[1]).filter(id => labs[id]).concat(Object.keys(labs).filter(id => !GROUPS.some(g => g[1].includes(id))));
  $('#nav').innerHTML = order.map(id => `<button role="tab" id="tab-${id}" data-lab="${id}" data-g="${groupOf(id)}" aria-selected="false"><small>${groupOf(id)}</small><span>${labs[id].tab}</span></button>`).join('');
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => show(b.dataset.lab));
  show(location.hash.slice(1) || store.get('lab', 'fridge'));
  requestAnimationFrame(loop);
}
